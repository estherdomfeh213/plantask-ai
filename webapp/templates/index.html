{% extends "base.html" %}
{% block content %}
<a href="/add">➕ Add Task</a>
<table>
    <tr>
        <th>ID</th><th>Title</th><th>Duration</th><th>Priority</th><th>Deadline</th>
    </tr>
    {% for task in tasks %}
    <tr>
        <td>{{ task[0] }}</td>
        <td>{{ task[1] }}</td>
        <td>{{ task[2] }} min</td>
        <td>{{ task[3] }}</td>
        <td>{{ task[4] }}</td>
    </tr>
    {% endfor %}
</table>
{% if not tasks %}
<p>📭 No tasks scheduled.</p>
{% endif %}
{% endblock %}
